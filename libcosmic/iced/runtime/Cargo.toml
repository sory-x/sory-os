[package]
name = "iced_runtime"
description = "A renderer-agnostic runtime for iced"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }

[lints]
workspace = true

[features]
debug = []
selector = ["dep:iced_selector"]
a11y = ["iced_accessibility", "iced_core/a11y"]
cctk = ["iced_core/cctk", "dep:cctk"]

[dependencies]
bytes = { workspace = true }
iced_core = { workspace = true }
"raw-window-handle" = { workspace = true }
thiserror = { workspace = true }

sipper = { workspace = true, optional = true }
iced_selector = { workspace = true, optional = true }
iced_futures = { workspace = true, features = ["thread-pool"] }
cctk = { workspace = true, optional = true }
iced_accessibility = { workspace = true, optional = true }
window_clipboard = { workspace = true }
dnd = { workspace = true }
