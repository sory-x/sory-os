[package]
edition.workspace = true
license.workspace = true
name = "sory-memories-write"
version.workspace = true

[lib]
name = "sory_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
sory-backend-client = { workspace = true }
sory-core = { workspace = true }
sory-config = { workspace = true }
sory-features = { workspace = true }
sory-git-utils = { workspace = true }
sory-login = { workspace = true }
sory-otel = { workspace = true }
sory-protocol = { workspace = true }
sory-rollout = { workspace = true }
sory-rollout-trace = { workspace = true }
sory-secrets = { workspace = true }
sory-state = { workspace = true }
sory-terminal-detection = { workspace = true }
sory-utils-absolute-path = { workspace = true }
sory-utils-output-truncation = { workspace = true }
sory-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
sory-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
