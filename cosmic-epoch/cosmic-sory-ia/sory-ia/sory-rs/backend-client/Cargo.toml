[package]
name = "sory-backend-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sory-backend-openapi-models = { path = "../sory-backend-openapi-models" }
sory-api = { workspace = true }
sory-client = { workspace = true }
sory-login = { workspace = true }
sory-model-provider = { workspace = true }
sory-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"
