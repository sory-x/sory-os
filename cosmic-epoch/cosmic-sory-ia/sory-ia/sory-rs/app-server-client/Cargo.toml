[package]
name = "sory-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sory_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
sory-app-server = { workspace = true }
sory-app-server-protocol = { workspace = true }
sory-arg0 = { workspace = true }
sory-config = { workspace = true }
sory-core = { workspace = true }
sory-exec-server = { workspace = true }
sory-feedback = { workspace = true }
sory-protocol = { workspace = true }
sory-uds = { workspace = true }
sory-utils-absolute-path = { workspace = true }
sory-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
