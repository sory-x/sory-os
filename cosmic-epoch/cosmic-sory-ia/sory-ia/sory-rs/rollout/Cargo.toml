[package]
edition = { workspace = true }
license = { workspace = true }
name = "sory-rollout"
version = { workspace = true }

[lib]
doctest = false
name = "sory_rollout"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
sory-file-search = { workspace = true }
sory-git-utils = { workspace = true }
sory-login = { workspace = true }
sory-otel = { workspace = true }
sory-protocol = { workspace = true }
sory-state = { workspace = true }
sory-utils-path = { workspace = true }
sory-utils-string = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
time = { workspace = true, features = [
    "formatting",
    "local-offset",
    "macros",
    "parsing",
] }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
