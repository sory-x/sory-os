[package]
edition = { workspace = true }
license = { workspace = true }
name = "sory-models-manager"
version = { workspace = true }

[lib]
doctest = false
name = "sory_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
sory-app-server-protocol = { workspace = true }
sory-collaboration-mode-templates = { workspace = true }
sory-login = { workspace = true }
sory-otel = { workspace = true }
sory-protocol = { workspace = true }
sory-utils-output-truncation = { workspace = true }
sory-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
