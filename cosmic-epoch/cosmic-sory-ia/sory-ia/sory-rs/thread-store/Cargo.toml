[package]
edition = { workspace = true }
license = { workspace = true }
name = "sory-thread-store"
version = { workspace = true }

[lib]
name = "sory_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
