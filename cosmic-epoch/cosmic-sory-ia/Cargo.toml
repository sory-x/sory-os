tungstenite                 = { version = "0.27.0", features = ["deflate", "proxy"] }
uds_windows                 = "1.1.0"
unicode-segmentation        = "1.12.0"
unicode-width               = "0.2"
url                         = "2"
urlencoding                 = "2.1"
uuid                        = "1"
v8                          = "=146.4.0"
vt100                       = "0.16.2"
walkdir                     = "2.5.0"
webbrowser                  = "1.0"
which                       = "8"
whoami                      = "1.6.1"
wildmatch                   = "2.6.1"
winapi-util                 = "0.1.11"
zip                         = "2.4.2"
zstd                        = "0.13"

wiremock                    = "0.6"
zeroize                     = "1.8.2"

# ═══════════════════════════════════════════════════════════════════════════════
# workspace.lints (depuis sory-rs)
# ═══════════════════════════════════════════════════════════════════════════════
[workspace.lints]
rust = {}

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

# ═══════════════════════════════════════════════════════════════════════════════
# Profiles
# ═══════════════════════════════════════════════════════════════════════════════
[profile.dev]
debug = "limited"

[profile.dev-small]
inherits = "dev"
opt-level = 0
debug = "none"
strip = "symbols"

[profile.release]
lto = "thin"
split-debuginfo = "off"
strip = "symbols"
codegen-units = 16

[profile.profiling]
inherits = "release"
debug = "full"
lto = "thin"
strip = false

[profile.ci-test]
debug = "limited"
inherits = "test"
opt-level = 0

# ═══════════════════════════════════════════════════════════════════════════════
# Patches (forks nécessaires à sory-rs / sory-desktop)
# ═══════════════════════════════════════════════════════════════════════════════
[patch.crates-io]
crossterm = { git = "https://github.com/nornagon/crossterm", rev = "87db8bfa6dc99427fd3b071681b07fc31c6ce995" }
ratatui = { git = "https://github.com/nornagon/ratatui", rev = "9b2ad1298408c45918ee9f8241a6f95498cdbed2" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
# rama-http 0.3.0-alpha.4 a un bug Box<str>/String — patch local
rama-http = { path = "patch-rama-http" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

