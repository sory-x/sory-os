    "sory-ia/sory-rs/utils/*",
    # Extensions sory-rs (via globs)
    "sory-ia/sory-rs/ext/*",
    # Mémoires sory-rs (via globs)
    "sory-ia/sory-rs/memories/*",
    # NOTE: libcosmic (cosmic-config, cosmic-theme, cosmic-config-derive) n'est PAS
    # membre de ce workspace. Il conserve son propre [workspace] et se build dans son
    # dossier (/home/sory/Bureau/soryos/libcosmic/). sory-desktop y accède via path.
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

