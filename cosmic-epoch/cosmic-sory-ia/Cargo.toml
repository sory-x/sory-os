# SPDX-License-Identifier: Apache-2.0
# ═══════════════════════════════════════════════════════════════════════════════
# Workspace Cargo UNIFIÉ pour cosmic-sory-ia
# ═══════════════════════════════════════════════════════════════════════════════
# Ce workspace regroupe DANS UN SEUL target/ :
#   • sory-rs      → moteur IA (115+ crates, fork OpenAI Codex)
#   • sory-desktop → interface graphique COSMIC
#
# libcosmic (toolkit UI SoryOS : cosmic-config, cosmic-theme, cosmic-config-derive)
# N'EST PAS membre de ce workspace : il conserve son propre [workspace] et se build
# dans son propre dossier (/home/sory/Bureau/soryos/libcosmic/). sory-desktop y
# accède via dépendance de chemin (path = "../../../libcosmic").
#
# Les workspace.dependencies ci-dessous sont celles de sory-rs + sory-desktop.
# Elles doivent rester compatibles avec les versions de libcosmic (dirs, tokio,
# serde, thiserror, tracing...) pour éviter les conflits de versions.
#
# BUILD :
#   cargo build --release --workspace   (depuis ce dossier)
#   ./build_unified.sh                  (script assistant)
# ═══════════════════════════════════════════════════════════════════════════════

[workspace]
resolver = "2"
members = [
    "sory-desktop",
    # Tous les crates du moteur sory-rs (via globs)
    "sory-ia/sory-rs/core",
    "sory-ia/sory-rs/cli",
