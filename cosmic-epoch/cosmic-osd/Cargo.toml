[package]
name = "cosmic-osd"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
futures = "0.3.32"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
cosmic-config = { path = "../../libcosmic/cosmic-config" }
cosmic-comp-config = { path = "../cosmic-comp/cosmic-comp-config" }
libcosmic = { path = "../../libcosmic", default-features = false, features = [
    "autosize",
    "dbus-config",
    "desktop-systemd-scope",
    "tokio",
    "wayland",
    "multi-window",
    "winit",
    "single-instance",
] }
log = "0.4.29"
logind-zbus = "5.3.2"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["process", "macros"] }
tokio-stream = "0.1.18"
uzers = "0.12.2"
xdg = "3.0"
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
kdl = "6"
cosmic-randr-shell = { path = "../cosmic-randr/shell", default-features = false }

[dependencies.cosmic-settings-airplane-mode-subscription]
path = "../cosmic-settings/subscriptions/airplane-mode"

[dependencies.cosmic-settings-audio-client]
path = "../cosmic-settings-daemon/audio-client"
features = ["codec"]

[dependencies.cosmic-settings-upower-subscription]
path = "../cosmic-settings/subscriptions/upower"

[dependencies.cosmic-settings-daemon-subscription]
path = "../cosmic-settings/subscriptions/settings-daemon"

[patch.'https://github.com/sory-x/sory-os']
libcosmic = { path = "../../libcosmic" }
cosmic-config = { path = "../../libcosmic/cosmic-config" }
cosmic-theme = { path = "../../libcosmic/cosmic-theme" }

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
