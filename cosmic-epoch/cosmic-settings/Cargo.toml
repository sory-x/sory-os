[workspace]
members = ["cosmic-settings", "page", "pages/*", "subscriptions/*"]
default-members = ["cosmic-settings"]
resolver = "3"

[workspace.package]
rust-version = "1.93"

[workspace.dependencies]
cosmic-randr = { git = "https://github.com/sory-x/cosmic-randr" }
tokio = { version = "1.49.0", features = ["macros"] }
iced_winit = { path = "../../libcosmic", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "rayon",
    "webp",
    "hdr",
] }

[workspace.dependencies.libcosmic]
features = [
    "dbus-config",
    "desktop",
    "multi-window",
    "winit",
    "tokio",
    "qr_code",
]
path = "../../libcosmic"

[workspace.dependencies.cosmic-config]
path = "../../libcosmic"

[workspace.dependencies.cosmic-bg-config]
git = "https://github.com/sory-x/cosmic-bg"

[workspace.dependencies.cosmic-comp-config]
git = "https://github.com/sory-x/cosmic-comp"
features = ["output"]

[workspace.dependencies.cosmic-idle-config]
git = "https://github.com/sory-x/cosmic-idle"

[workspace.dependencies.cosmic-panel-config]
git = "https://github.com/sory-x/cosmic-panel"

[workspace.dependencies.cosmic-randr-shell]
git = "https://github.com/sory-x/cosmic-randr"

[workspace.dependencies.sctk]
version = "0.20"
package = "smithay-client-toolkit"

[profile.dev]
opt-level = 3
lto = "off"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
lto = "off"
debug = true

# [patch.'https://github.com/sory-x/cosmic-text']
# cosmic-text = { git = "https://github.com/sory-x/cosmic-text//", rev = "b017d7c" }

[patch.'https://github.com/sory-x/cosmic-protocols']
cosmic-protocols = { git = "https://github.com/sory-x/cosmic-protocols//", rev = "e95d895" }
cosmic-client-toolkit = { git = "https://github.com/sory-x/cosmic-protocols//", rev = "e95d895" }

# [patch.'https://github.com/sory-x/cosmic-settings-daemon']
# cosmic-settings-config = { git = "https://github.com/sory-x/cosmic-settings-daemon//", branch = "input_nobuild" }

# For development and testing purposes
atspi = { git = "https://github.com/wash2/atspi" }
atspi-common = { git = "https://github.com/wash2/atspi" }
