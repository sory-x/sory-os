[workspace]
members = [
    "cosmic-panel-bin",
    "cosmic-panel-config",
    "xdg-shell-wrapper-config",
]
resolver = "3"

[profile.dev]
opt-level = 1

[workspace.package]
license = "GPL-3.0-only"

[profile.release]
lto = "thin"

[workspace.dependencies]
sctk = { package = "smithay-client-toolkit", version = "0.20.0", features = [
    "calloop",
    "xkbcommon",
] }

[patch."https://github.com/sory-x/cosmic-protocols"]
cctk = { package = "cosmic-client-toolkit", git = "https://github.com/sory-x//cosmic-protocols", rev = "32283d7" }
cosmic-protocols = { git = "https://github.com/sory-x//cosmic-protocols", rev = "32283d7" }

